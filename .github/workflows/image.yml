name: Image

# Build and publish the microagency workload OCI image with microagent (no
# Docker). Building never boots a VM — microagent assembles the rootfs from the
# base image plus the spec's baked files and extracts it on the host
# (mke2fs/debugfs) — so it runs on a stock runner. Pull requests build only, to
# validate the whole path. A successful main CI run and version tags publish.
on:
  pull_request:
    branches: [main]
  merge_group:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: true

jobs:
  image:
    name: image-build
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      REPO_IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Use the exact microagent module version selected by go.mod. A separate
      # newest-supported canary may be useful, but the required product build
      # must be reproducible from this repository alone.
      - name: Install pinned microagent
        run: |
          sudo apt-get update
          sudo apt-get install -y e2fsprogs passt
          version="$(go list -m -f '{{.Version}}' github.com/geoffbelknap/microagent)"
          go install "github.com/geoffbelknap/microagent/cmd/microagent@${version}"
          go install "github.com/geoffbelknap/microagent/cmd/microagent-guestinit@${version}"
          go install "github.com/geoffbelknap/microagent/cmd/microagent-firecracker-supervisor@${version}"
          mkdir -p "$(go env GOPATH)/libexec"
          cp "$(go env GOPATH)/bin/microagent-guestinit" \
            "$(go env GOPATH)/libexec/microagent-guestinit-$(go env GOARCH)"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "MICROAGENT_VERSION=$version" >> "$GITHUB_ENV"
          "$(go env GOPATH)/bin/microagent" version

      - name: Record build inputs
        run: |
          {
            echo "### Image build inputs"
            echo "- microagency: \`${{ github.event.workflow_run.head_sha || github.sha }}\`"
            echo "- microagent module: \`$MICROAGENT_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify microagent
        run: |
          microagent version

      # `make image` runs the whole build (static binary + create + commit), so
      # pull requests exercise and validate the entire path. Merges to main and
      # version tags authenticate and commit-with-push to the destination tag.
      # One tag per event: committing the same rootfs to a second tag needs an
      # idempotent-blob commit (microagent >= the release that dedupes existing
      # OCI-layout blobs); add an immutable :sha tag here once that ships.
      - name: Build and publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "merge_group" ]; then
            make image IMAGE_REF="$REPO_IMAGE:ci-validate"
            exit 0
          fi
          echo "$GHCR_TOKEN" | microagent registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="$REPO_IMAGE:latest"
          case "${{ github.ref }}" in
            refs/tags/*) ref="$REPO_IMAGE:${GITHUB_REF_NAME}" ;;
          esac
          make image PUSH=1 IMAGE_REF="$ref"
