name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-cache
        with:
          job: build-test
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test with coverage
        run: go test -short -coverprofile=coverage.out -covermode=atomic ./...
      - name: Report coverage
        run: |
          total="$(go tool cover -func=coverage.out | tail -1)"
          echo "### Go coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$total\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Test standalone modules
        run: |
          while IFS= read -r module; do
            dir="${module%/go.mod}"
            echo "::group::$dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done < <(find engines minimizers -name go.mod -print | sort)

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-cache
        with:
          job: race
      - name: Race test
        run: go test -race -short ./...

  static-analysis:
    name: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-cache
        with:
          job: static-analysis
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  workflows:
    name: workflow-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/go-cache
        with:
          job: workflow-checks
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
