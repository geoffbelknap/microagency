name: Latest

# Latest train: a successful CI run for main tags the validated commit,
# publishes a prerelease, and updates the `microagency-latest` Homebrew formula.
# Old latest prereleases are pruned. Stable releases are cut by tagging.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

# If merges land quickly, only the newest build needs to publish.
concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  latest:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Report live reduce validation posture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh api "repos/${{ github.repository }}/actions/workflows/live-reduce.yml/runs?status=completed&per_page=1" --jq '.workflow_runs[0] // empty')"
          if [ -z "$run" ]; then
            echo "### Live reduce(code) validation" >> "$GITHUB_STEP_SUMMARY"
            echo "No completed cross-backend live run is recorded." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::No completed cross-backend live reduce(code) run is recorded"
            exit 0
          fi
          conclusion="$(jq -r '.conclusion' <<< "$run")"
          completed="$(jq -r '.updated_at' <<< "$run")"
          url="$(jq -r '.html_url' <<< "$run")"
          sha="$(jq -r '.head_sha' <<< "$run")"
          age_hours="$(( ($(date -u +%s) - $(date -u -d "$completed" +%s)) / 3600 ))"
          {
            echo "### Live reduce(code) validation"
            echo "- Result: \`$conclusion\`"
            echo "- Age: \`${age_hours}h\`"
            echo "- Commit: \`$sha\`"
            echo "- Run: $url"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$conclusion" != success ] || [ "$age_hours" -gt 168 ]; then
            echo "::warning::Cross-backend live validation is $conclusion and ${age_hours}h old"
          fi

      # A GitHub App token scoped to the tap repo, so GoReleaser can push the
      # generated formula. NOTE: this repo needs the HOMEBREW_APP_CLIENT_ID and
      # HOMEBREW_APP_PRIVATE_KEY secrets, and the app installed on homebrew-tap.
      - name: Generate Homebrew tap token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: go.sum

      # Anchor the version to the most recent stable tag it's based on, so the
      # channel reads e.g. 0.1.1-latest.<N> (a prerelease of that stable line)
      # instead of a bare 0.0.0. The commit count N is monotonic, so the version
      # strictly increases across merges and Homebrew treats each build as newer.
      - name: Tag this build
        id: tag
        run: |
          base="$(git tag -l 'v[0-9]*' | grep -v -- '-latest' | sort -V | tail -1)"
          base="${base#v}"
          [ -n "$base" ] || base="0.0.0"
          version="v${base}-latest.$(git rev-list --count HEAD)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2.16"
          args: release --clean --config .goreleaser.latest.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.app-token.outputs.token }}

      # Keep only the newest few latest prereleases (and their tags), so the
      # releases page doesn't accumulate one entry per merge.
      - name: Prune old latest prereleases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 200 --json tagName,isPrerelease \
            | jq -r '.[] | select(.isPrerelease and (.tagName | contains("-latest."))) | .tagName' \
            | sort -t. -k4 -n \
            | head -n -5 \
            | while read -r t; do
                echo "pruning $t"
                gh release delete "$t" --yes --cleanup-tag || true
              done
